# Supabase pauses free projects after a week without activity, which would stop
# the contact form saving enquiries. This pings the Roots database every 3 days.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the Roots database
        run: |
          curl --fail --silent --show-error -X POST \
            "https://twaklbsmvjiknisnrskt.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable__StLS2xJGENODyD2tu_L-Q_5kjuJwDF" \
            -H "Content-Type: application/json" \
            -d '{}'
